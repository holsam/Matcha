[project]
name = "matcha"
version = "3.1.0"
description = "A video matching tool using perceptual hashing."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.13.2",
    "imagehash>=4.3.2",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "pyacoustid>=1.3.1",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "send2trash>=2.1.0",
    "streamlit>=1.66.0",
    "tqdm>=4.67.3",
    "typer>=0.24.1",
]

[project.scripts]
matcha = "matcha.cli:app"

[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "opencv-python>=4.13.0.92",
    "pytest>=9.0.3",
]
